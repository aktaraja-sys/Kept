name: Android build

# Builds an installable debug APK on every push to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - run: npm ci
      - name: Build the app (vault stored on the device)
        working-directory: apps/web
        run: npm run build:android
      - name: Build the APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk kept-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kept-android-debug
          path: kept-preview.apk
          retention-days: 30
      # Publish to a fixed release so there is always one simple download link:
      # https://github.com/<owner>/<repo>/releases/download/android-preview/kept-preview.apk
      - name: Publish to the android-preview release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: Kept Android preview
          body: |
            Latest preview build of the Kept Android app, from commit ${{ github.sha }}.
            Download kept-preview.apk on your Android phone and open it to install.
            Preview only: the encrypted vault is stored on the phone. Don't store real personal data yet.
          prerelease: true
          files: kept-preview.apk
